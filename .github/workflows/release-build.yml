name: Apple Silicon macOS release build

on:
  workflow_dispatch:
  push:
    branches: [main, apple-silicon-release]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-arm64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify arm64 app
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Desk-Controller-arm64
          path: |
            build/release/Desk.Controller.app.zip
            build/release/SHA256SUMS
          if-no-files-found: error
